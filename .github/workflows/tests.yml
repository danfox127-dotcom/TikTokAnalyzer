name: tests

# Runs the backend test suite on every pull request and on pushes to main.
# The frontend has its own Jest suite (algorithmic-mirror/); it is not run here.
on:
  pull_request:
  push:
    branches: [main]

# A new push to a PR makes the in-flight run redundant — cancel it rather than
# paying for a result nobody will read.
concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pytest:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          # Matches .python-version and pyrightconfig.json
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-calibration.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          # Calibration extras (duckdb, pyarrow). Without them the calibration
          # tests skip rather than fail, so a missing install would hide
          # breakage instead of reporting it.
          pip install -r requirements-calibration.txt

      - name: Check no tests were skipped for missing dependencies
        run: |
          python -c "import duckdb, pyarrow" \
            || { echo "calibration extras missing — tests would silently skip"; exit 1; }

      - name: Run pytest
        run: pytest tests/ -v --tb=short
