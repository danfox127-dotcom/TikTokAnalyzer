name: tests

# Runs the test suites on every pull request and on pushes to main: the Python
# backend (pytest), Faves again with its library in Postgres, and the Next.js
# frontend (jest). The jobs are independent and run in parallel.
on:
  pull_request:
  push:
    branches: [main]

# A new push to a PR makes the in-flight run redundant — cancel it rather than
# paying for a result nobody will read.
concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pytest:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          # Matches .python-version and pyrightconfig.json
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-calibration.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          # Calibration extras (duckdb, pyarrow). Without them the calibration
          # tests skip rather than fail, so a missing install would hide
          # breakage instead of reporting it.
          pip install -r requirements-calibration.txt

      - name: Check no tests were skipped for missing dependencies
        run: |
          python -c "import duckdb, pyarrow" \
            || { echo "calibration extras missing — tests would silently skip"; exit 1; }

      - name: Run pytest
        run: pytest tests/ -v --tb=short

  # Faves' tests again, with each test's library in Postgres -- the database it
  # uses in the cloud (Supabase). The same tests; only the storage underneath
  # changes. A test about SQLite library files on disk skips itself here.
  faves-postgres:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    services:
      postgres:
        # Supabase runs Postgres 17.
        image: postgres:17
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Faves' tests on Postgres
        env:
          FAVES_TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/postgres
        run: pytest tests/test_favorites_*.py --tb=short

  jest:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    defaults:
      run:
        working-directory: algorithmic-mirror

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          # The repo pins no Node version (no .nvmrc, no engines field);
          # GEMINI.md calls for Node 20+, so this tracks current LTS.
          node-version: "22"
          cache: npm
          cache-dependency-path: algorithmic-mirror/package-lock.json

      - name: Install dependencies
        # `npm ci` deliberately, not `npm install --legacy-peer-deps` as in the
        # local setup docs: that flag is for resolving a fresh tree, while `ci`
        # installs the already-resolved lockfile and does not need it. Plain
        # `ci` is also the stricter choice — it fails loudly if package.json and
        # the lockfile ever drift apart, which is what CI should do.
        run: npm ci

      - name: Run jest
        # One suite stays skipped here by design: ForensicDashboard.realdata
        # is gated on a real TikTok export at /tmp/ttk_profile.json, which is
        # personal data and must never exist on a runner. Unlike the backend's
        # calibration extras above, this skip is correct — do not add a guard
        # that fails the job for it.
        run: npm test
